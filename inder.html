<body class="bg-white">

  <div class="flex p-5 md:p-8 justify-between items-center">
    <div class="flex gap-5 md:gap-10 items-center">
    <img src="logo.svg">

      <div class="hidden md:flex gap-6">
        <span>Features</span>
        <span>Company</span>
        <span>Careers</span>
        <span>About</span>
      </div>

    </div>
    <div class="flex gap-5 md:gap-10 items-center">
      <span class="hidden md:block">Login</span>
      <button class="hidden md:block border rounded-md px-4 py-1">Register</button>
   <button id="menuBtn" class="md:hidden">  
      <img src="burger-menu-svgrepo-com.svg" class="w-6 h-6">
   </button>
    </div>
  </div>

  <div id="overlay" class="fixed inset-0 bg-black/40 hidden"></div>

  <div id="mobileMenu"
  class="fixed top-0 right-0 w-2/3 h-full bg-white shadow-lg p-6 flex flex-col gap-6 transform translate-x-full transition-transform duration-300 md:hidden">
    <button id="closeBtn" class="self-end text-2xl">✕</button>
    <span>Features</span>
    <span>Company</span>
    <span>Careers</span>
    <span>About</span>

    <div class="mt-6 flex flex-col gap-3">
      <span>Login</span>
      <button class="border rounded-md px-4 py-1">Register</button>
    </div>
  </div>
  <div class="flex flex-col-reverse md:flex-row items-center justify-center gap-10 md:gap-20 px-5 mt-10">
    <div class="flex flex-col text-center md:text-left max-w-md">
      <h1 class="font-bold text-4xl md:text-7xl">Make</h1> 
      <h1 class="font-bold text-4xl md:text-7xl">remote work</h1>

      <p class="mt-6">
        Get your team in sync, no matter your location.
      </p>

      <button class="bg-black text-white rounded-xl px-5 py-2 mt-8 w-fit mx-auto md:mx-0">
        Learn more
      </button>
    </div>

    <div>
      <img src="image-hero-desktop.png" class="w-[300px] md:w-[450px]">
    </div>

  </div>

  <script>

    const menu = document.getElementById("mobileMenu");
    const openBtn = document.getElementById("menuBtn");
    const closeBtn = document.getElementById("closeBtn");
    const overlay = document.getElementById("overlay");

    openBtn.addEventListener("click", () => {
      menu.classList.remove("translate-x-full");
      overlay.classList.remove("hidden");

    });

    closeBtn.addEventListener("click", () => {
      menu.classList.add("translate-x-full");
      overlay.classList.add("hidden");

    });

    overlay.addEventListener("click", () => {
      menu.classList.add("translate-x-full");
      overlay.classList.add("hidden");

    });

  </script>

</body>
